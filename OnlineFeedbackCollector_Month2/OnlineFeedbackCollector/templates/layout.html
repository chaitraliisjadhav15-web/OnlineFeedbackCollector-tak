<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Feedback Collector{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="{{ url_for('home') }}">
            Feedback Collector
        </a>

        <a class="btn btn-outline-light btn-sm" href="{{ url_for('admin_dashboard') }}">
            Admin Dashboard
        </a>
    </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="text-center text-muted py-4">
    <small>Online Feedback Collector</small>
</footer>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
